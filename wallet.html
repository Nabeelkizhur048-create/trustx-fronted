<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustX Wallet TRC20 Premium</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#050505;color:#fff;min-height:100vh;padding:16px;padding-bottom:100px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 20px}
.logo{font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px}
.badge-gold{background:linear-gradient(135deg,#2a2410,#3d3310);border:1px solid #6b5a1f;color:#facc15;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600}
.card{background:radial-gradient(120% 120% at 10% 0%,#2a2410 0%,#17120a 25%,#101010 60%,#0f0f0f 100%);border:1px solid rgba(250,204,21,0.25);border-radius:28px;padding:22px;margin-bottom:18px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:-60px;left:-20px;width:250px;height:120px;background:radial-gradient(ellipse,#facc15,transparent 70%);opacity:0.12;pointer-events:none}
.label{color:#9a9a9a;font-size:13px;letter-spacing:1.5px;display:flex;align-items:center;gap:6px}
.balance{font-size:42px;font-weight:800;margin:14px 0 8px;letter-spacing:-1px}
.addr-short{color:#8a8a8a;font-size:15px;display:flex;align-items:center;gap:8px}
.btn-row{display:flex;gap:12px;margin-top:18px}
.btn{flex:1;padding:16px;border-radius:16px;border:none;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-white{background:#fff;color:#000}
.btn-yellow{background:linear-gradient(135deg,#facc15,#eab308);color:#000;box-shadow:0 4px 20px rgba(250,204,21,0.3)}
.card2{background:linear-gradient(180deg,#151515,#0e0e0e);border:1px solid rgba(250,204,21,0.18);border-radius:28px;padding:24px;text-align:center}
.qr-box{background:#fff;padding:14px;border-radius:20px;display:inline-block;margin:18px 0;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
.addr-full{background:rgba(255,255,255,0.06);border:1px solid rgba(250,204,21,0.2);padding:14px;border-radius:14px;color:#facc15;font-size:14px;word-break:break-all;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#facc15;padding:10px 18px;border-radius:30px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.bottom-nav{position:fixed;bottom:16px;left:16px;right:16px;background:rgba(20,20,20,0.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;display:flex;justify-content:space-around;padding:12px 0}
.nav-item{color:#666;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer}
.nav-item.active{color:#facc15}
</style>
</head>
<body>
<div class="top">
<div class="logo">🛡️ TrustX Wallet <span class="badge-gold">TRC20</span></div>
<div class="badge-gold" style="cursor:pointer" onclick="location.href='index.html'">⊞ Home</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<div class="label">TOTAL BALANCE 👁️</div>
<div class="badge-gold" style="background:#facc15;color:#000;border:none">◉ TRC20</div>
</div>
<div class="balance" id="bal">$ 0.00</div>
<div class="addr-short"><span id="shortAddr">TCEnW5...5Dwn2E</span> <span style="color:#facc15;cursor:pointer" onclick="copyAddr()">⎙</span></div>
<div class="btn-row">
<button class="btn btn-white">✈️ Send</button>
<button class="btn btn-yellow" onclick="document.getElementById('receiveSec').scrollIntoView({behavior:'smooth'})">⬇ Receive</button>
</div>
</div>

<div class="card2" id="receiveSec">
<div class="label" style="justify-content:center">🛡️ YOUR TRC20 ADDRESS</div>
<div id="qrcode" class="qr-box"></div>
<div class="addr-full"><span id="fullAddr">TCEnW5WTXfLtmL7ghzhUWQnP9f8b5Dwn2E</span><span style="cursor:pointer" onclick="copyAddr()">⎙</span></div>
<div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
<button class="mini-btn" onclick="shareAddr()">↗ Share</button>
<button class="mini-btn" onclick="copyAddr()">⎙ Copy Address</button>
</div>
<p id="status" style="color:#666;font-size:12px;margin-top:12px">Live Balance • TRON Network</p>
</div>

<div class="bottom-nav">
<div class="nav-item active"><span style="font-size:22px">⌂</span>Wallet</div>
<div class="nav-item"><span style="font-size:22px">⇄</span>Swap</div>
<div class="nav-item" onclick="getBalance()"><span style="font-size:22px">◷</span>Activity</div>
</div>

<script>
const FALLBACK = 'TCEnW5WTXfLtmL7ghzhUWQnP9f8b5Dwn2E';
let walletAddr = localStorage.getItem('trustx_wallet') || FALLBACK;
function init(){
  if(!walletAddr) walletAddr = FALLBACK;
  document.getElementById('fullAddr').innerText = walletAddr;
  document.getElementById('shortAddr').innerText = walletAddr.slice(0,6)+'...'+walletAddr.slice(-6);
  localStorage.setItem('trustx_wallet', walletAddr);
  try{
    document.getElementById('qrcode').innerHTML='';
    new QRCode(document.getElementById('qrcode'), {text: walletAddr, width: 190, height: 190});
  }catch(e){}
  getBalance();
}
async function getBalance(){
  const balEl = document.getElementById('bal');
  try{
    const res = await fetch('https://apilist.tronscanapi.com/api/account?address='+walletAddr);
    const data = await res.json();
    let total = 0;
    if(data.trc20token_balances){
      const usdt = data.trc20token_balances.find(t => t.tokenAbbr === 'USDT');
      if(usdt){ total = usdt.balance / Math.pow(10, usdt.tokenDecimal || 6); }
    }
    balEl.innerText = '$ ' + total.toFixed(2);
  }catch(e){ balEl.innerText = '$ 0.00'; }
}
function copyAddr(){ navigator.clipboard.writeText(walletAddr); alert('Copied: '+walletAddr); }
function shareAddr(){ if(navigator.share){ navigator.share({title:'My TRC20 Address', text: walletAddr}); } else{ copyAddr(); } }
init();
</script>
</body>
</html>
