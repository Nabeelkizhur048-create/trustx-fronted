<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>USDT TRC20 Wallet - TrustX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system}
body{background:#080808;color:#fff;min-height:100vh;padding:14px;padding-bottom:24px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo-icon{width:38px;height:38px;background:#facc15;border-radius:10px;display:grid;place-items:center;color:#000;font-size:20px;font-weight:800}
.scan-btn{width:42px;height:42px;background:#141414;border:1px solid #222;border-radius:12px;display:grid;place-items:center;font-size:18px;cursor:pointer}
.card-main{background:linear-gradient(145deg,#1c1c1c,#111,#0e0e0e);border:1px solid #222;border-radius:26px;padding:20px}
.badge-trc{background:#1e1a05;border:1px solid #3a3410;color:#facc15;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
.lbl{color:#666;font-size:11px;letter-spacing:1.2px;font-weight:600}
.bal{font-size:38px;font-weight:800;margin:12px 0 6px;letter-spacing:-1.5px}
.addr-mini{color:#555;font-size:12px;font-family:monospace}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:14px;border:none;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn-w{background:#fff;color:#000}
.btn-y{background:#facc15;color:#000}
.tabs{background:#121212;border:1px solid #1e1e1e;border-radius:20px;padding:5px;display:flex;gap:4px;margin:18px 0 16px}
.tab{flex:1;padding:12px;text-align:center;border-radius:14px;font-size:13px;font-weight:600;color:#666;cursor:pointer}
.tab.active{background:#fff;color:#000}
.panel{background:#111;border:1px solid #1e1e1e;border-radius:24px;padding:22px;min-height:380px}
.panel-title{color:#888;font-size:11px;letter-spacing:1px;text-align:center;margin-bottom:18px;font-weight:600}
.qr-wrap{background:#fff;padding:14px;border-radius:18px;display:inline-block;cursor:pointer}
.addr-box{margin-top:18px;background:#0c0c0c;border:1px dashed #2a2a2a;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.addr-txt{color:#facc15;font-size:13px;font-family:monospace;word-break:break-all;flex:1}
.icon-btn{width:34px;height:34px;background:#1a1a1a;border-radius:8px;display:grid;place-items:center;cursor:pointer;margin-left:10px;border:1px solid #2a2a2a;color:#facc15}
.action-row{display:flex;gap:10px;margin-top:16px}
.action-btn{flex:1;background:#161616;border:1px solid #222;padding:13px;border-radius:12px;color:#ddd;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.action-btn.primary{background:#facc15;color:#000;border-color:#facc15;font-weight:700}
.input-group{margin-bottom:14px;text-align:left}
.input-label{color:#777;font-size:11px;font-weight:600;letter-spacing:0.8px;margin-bottom:6px;display:block}
.input{width:100%;background:#0e0e0e;border:1px solid #252525;border-radius:12px;padding:14px;color:#fff;font-size:14px;outline:none}
.input:focus{border-color:#facc15;background:#151515}
.send-btn{width:100%;background:linear-gradient(135deg,#facc15,#eab308);color:#000;border:none;padding:16px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px}
.note{font-size:11px;color:#555;text-align:center;margin-top:10px;line-height:1.4}
.tx{border-bottom:1px solid #151515;padding:14px 0;display:flex;justify-content:space-between;align-items:center}
.tx-type{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:14px}
.tx-in{background:#0f1f0f;color:#22c55e}
.tx-out{background:#1f0f0f;color:#ef4444}
.tx-addr{font-size:13px;font-weight:600}
.tx-date{font-size:11px;color:#555;margin-top:2px}
.tx-amt{font-weight:700;font-size:14px}
.tx-amt.in{color:#22c55e}
.empty{text-align:center;padding:50px 20px;color:#444}
#reader{width:100%;border-radius:16px;overflow:hidden;margin-top:12px}
</style>
</head>
<body>
<div class="top">
<div class="logo"><div class="logo-icon">₮</div>USDT TRC20 Wallet</div>
<div style="display:flex;gap:8px">
<div class="scan-btn" onclick="openScanner()">◫</div>
<div class="scan-btn" onclick="location.href='index.html'">⌂</div>
</div>
</div>
<div class="card-main">
<div style="display:flex;justify-content:space-between;align-items:center">
<div class="lbl">TOTAL BALANCE</div>
<div class="badge-trc"><span style="width:6px;height:6px;background:#facc15;border-radius:50%;display:inline-block"></span>TRC20</div>
</div>
<div class="bal" id="balMain">$ 0.00</div>
<div class="addr-mini" id="shortAddr">Loading...</div>
<div class="btn-row">
<button class="btn btn-w" onclick="switchTab('send')">📤 Send</button>
<button class="btn btn-y" onclick="switchTab('receive')">📥 Receive</button>
</div>
</div>
<div class="tabs">
<div class="tab active" id="tab-receive" onclick="switchTab('receive')">Receive</div>
<div class="tab" id="tab-send" onclick="switchTab('send')">Send</div>
<div class="tab" id="tab-history" onclick="switchTab('history')">History</div>
</div>
<div class="panel" id="panel-receive" style="text-align:center">
<div class="panel-title">YOUR TRC20 ADDRESS - TAP QR TO COPY</div>
<div class="qr-wrap" onclick="copyAddr()"><div id="qrcode"></div></div>
<div class="addr-box">
<div class="addr-txt" id="fullAddr">Loading...</div>
<div class="icon-btn" onclick="copyAddr()">⎙</div>
</div>
<div class="action-row">
<button class="action-btn primary" onclick="copyAddr()">⎙ Copy Address</button>
<button class="action-btn" onclick="shareAddr()">↗ Share</button>
</div>
<div class="action-row" style="margin-top:10px">
<button class="action-btn" onclick="downloadQR()">⬇ Save QR</button>
<button class="action-btn" onclick="getBalance()">↻ Refresh</button>
</div>
<div style="margin-top:16px;background:#0a0a0a;border-radius:12px;padding:12px;display:flex;justify-content:space-between;font-size:12px">
<div><div style="color:#555">USDT</div><div style="color:#fff;font-weight:700;margin-top:2px" id="usdtBal">$0.00</div></div>
<div><div style="color:#555">TRX Gas</div><div style="color:#fff;font-weight:700;margin-top:2px" id="trxBal2">0 TRX</div></div>
<div><div style="color:#555">Network</div><div style="color:#22c55e;font-weight:700;margin-top:2px">● Active</div></div>
</div>
</div>
<div class="panel" id="panel-send" style="display:none">
<div class="panel-title">SEND USDT (TRC20)</div>
<div class="input-group">
<label class="input-label">RECIPIENT ADDRESS <span style="color:#facc15;cursor:pointer;float:right" onclick="openScanner()">📷 SCAN QR</span></label>
<input class="input" id="toAddr" placeholder="T... Paste or Scan">
</div>
<div id="scanner-area" style="display:none">
<div id="reader"></div>
<button class="action-btn" style="width:100%;margin-top:10px" onclick="closeScanner()">✕ Close Camera</button>
</div>
<div class="input-group">
<label class="input-label">AMOUNT (USDT)</label>
<input class="input" id="amount" type="number" placeholder="0.00">
<div style="display:flex;gap:8px;margin-top:8px">
<button style="padding:6px 12px;border-radius:20px;border:1px solid #2a2a2a;background:#141414;color:#aaa;cursor:pointer" onclick="document.getElementById('amount').value='5'">5</button>
<button style="padding:6px 12px;border-radius:20px;border:1px solid #2a2a2a;background:#141414;color:#aaa;cursor:pointer" onclick="document.getElementById('amount').value='10'">10</button>
<button style="padding:6px 12px;border-radius:20px;border:1px solid #2a2a2a;background:#141414;color:#aaa;cursor:pointer" onclick="document.getElementById('amount').value='50'">50</button>
<button style="padding:6px 12px;border-radius:20px;border:1px solid #2a2a2a;background:#141414;color:#aaa;cursor:pointer" onclick="setMax()">MAX</button>
</div>
</div>
<button class="send-btn" onclick="sendUSDT()">Send USDT →</button>
<div class="note">⚠️ Need ~13 TRX for gas. Irreversible.</div>
<div id="sendStatus" style="margin-top:12px;font-size:12px;text-align:center"></div>
</div>
<div class="panel" id="panel-history" style="display:none">
<div class="panel-title">TRANSACTION HISTORY</div>
<div id="txList"><div class="empty">Loading...</div></div>
</div>
<script>
const FALLBACK='TCEnW5WTXfLtmL7ghzhUWQnP9f8b5Dwn2E';
let walletAddr=localStorage.getItem('trustx_wallet')||FALLBACK;
let usdtBalance=0;let trxBalance=0;let html5QrCode=null;
function init(){
  if(!walletAddr||walletAddr.length<20) walletAddr=FALLBACK;
  document.getElementById('fullAddr').innerText=walletAddr;
  document.getElementById('shortAddr').innerText=walletAddr.slice(0,6)+'...'+walletAddr.slice(-4)+' • 0 TRX';
  localStorage.setItem('trustx_wallet',walletAddr);
  try{document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:walletAddr,width:180,height:180});}catch(e){}
  getBalance();getHistory();
}
async function getBalance(){
  try{
    document.getElementById('balMain').innerText='$ ...';
    const res=await fetch('https://apilist.tronscanapi.com/api/account?address='+walletAddr);
    const data=await res.json();
    let usdt=0;trxBalance=(data.balance||0)/1e6;
    if(data.trc20token_balances){const t=data.trc20token_balances.find(x=>x.tokenAbbr==='USDT');if(t)usdt=t.balance/Math.pow(10,t.tokenDecimal||6);}
    usdtBalance=usdt;
    document.getElementById('balMain').innerText='$ '+usdt.toFixed(2);
    document.getElementById('usdtBal').innerText='$'+usdt.toFixed(2);
    document.getElementById('trxBal2').innerText=trxBalance.toFixed(2)+' TRX';
    document.getElementById('shortAddr').innerText=walletAddr.slice(0,6)+'...'+walletAddr.slice(-4)+' • '+trxBalance.toFixed(2)+' TRX';
  }catch(e){document.getElementById('balMain').innerText='$ 0.00';}
}
async function getHistory(){
  const list=document.getElementById('txList');
  try{
    const res=await fetch('https://apilist.tronscanapi.com/api/token_trc20/transfers?limit=20&sort=-timestamp&relatedAddress='+walletAddr);
    const data=await res.json();
    if(!data.token_transfers||data.token_transfers.length===0){list.innerHTML='<div class="empty">No transactions yet</div>';return;}
    let html='';
    data.token_transfers.forEach(tx=>{
      const isIn=tx.to_address===walletAddr;
      const amt=(tx.quant/Math.pow(10,6)).toFixed(2);
      const date=new Date(tx.block_timestamp).toLocaleDateString();
      const other=isIn?tx.from_address:tx.to_address;
      html+=`<div class="tx"><div style="display:flex;gap:10px;align-items:center"><div class="tx-type ${isIn?'tx-in':'tx-out'}">${isIn?'↓':'↑'}</div><div><div class="tx-addr">${isIn?'Received':'Sent'} ${other.slice(0,6)}...${other.slice(-4)}</div><div class="tx-date">${date}</div></div></div><div class="tx-amt ${isIn?'in':''}">${isIn?'+':''}${amt}</div></div>`;
    });
    list.innerHTML=html;
  }catch(e){list.innerHTML='<div class="empty">Retry<br><button onclick="getHistory()" style="padding:6px 12px;border-radius:20px;border:1px solid #2a2a2a;background:#141414;color:#aaa;margin-top:8px">Refresh</button></div>';}
}
function switchTab(t){['receive','send','history'].forEach(x=>{document.getElementById('panel-'+x).style.display=x===t?'block':'none';document.getElementById('tab-'+x).classList.toggle('active',x===t);});if(t==='history')getHistory();if(t==='receive')getBalance();closeScanner();}
function copyAddr(){navigator.clipboard.writeText(walletAddr).then(()=>{const el=document.getElementById('fullAddr');const old=el.innerText;el.innerText='✅ Copied!';el.style.color='#22c55e';setTimeout(()=>{el.innerText=old;el.style.color='#facc15';},1500);});}
function shareAddr(){if(navigator.share){navigator.share({title:'USDT TRC20',text:walletAddr});}else{copyAddr();}}
function downloadQR(){const canvas=document.querySelector('#qrcode canvas');if(canvas){const a=document.createElement('a');a.download='USDT_QR.png';a.href=canvas.toDataURL();a.click();}}
function setMax(){document.getElementById('amount').value=usdtBalance.toFixed(2);}
function openScanner(){switchTab('send');document.getElementById('scanner-area').style.display='block';const rd=document.getElementById('reader');rd.innerHTML='';html5QrCode=new Html5Qrcode("reader");html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},(d)=>{document.getElementById('toAddr').value=d;closeScanner();},(e)=>{}).catch(err=>{document.getElementById('scanner-area').innerHTML='<div style="color:#ef4444;text-align:center">Camera permission needed</div><button onclick="closeScanner()" style="width:100%;margin-top:10px">Close</button>';});}
function closeScanner(){if(html5QrCode){html5QrCode.stop().then(()=>html5QrCode.clear()).catch(()=>{});html5QrCode=null;}document.getElementById('scanner-area').style.display='none';document.getElementById('reader').innerHTML='';}
async function sendUSDT(){
  const to=document.getElementById('toAddr').value.trim();const amt=document.getElementById('amount').value;const status=document.getElementById('sendStatus');
  if(!to||!to.startsWith('T')||to.length<20){status.innerHTML='<span style="color:#ef4444">❌ Invalid address</span>';return;}
  if(!amt||parseFloat(amt)<=0){status.innerHTML='<span style="color:#ef4444">❌ Enter amount</span>';return;}
  if(parseFloat(amt)>usdtBalance){status.innerHTML='<span style="color:#ef4444">❌ Insufficient $'+usdtBalance.toFixed(2)+'</span>';return;}
  if(trxBalance<5){status.innerHTML='<span style="color:#ef4444">❌ Need 13 TRX gas</span>';return;}
  status.innerHTML='<span style="color:#facc15">⏳ Sending...</span>';
  try{
    const res=await fetch('https://trustx-backend.vercel.app/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:walletAddr,to:to,amount:amt})});
    const data=await res.json();
    if(data.success){status.innerHTML=`<span style="color:#22c55e">✅ Sent! TX: ${data.txId}</span>`;getBalance();getHistory();}
    else{status.innerHTML=`<span style="color:#ef4444">❌ ${data.error}</span>`;}
  }catch(e){status.innerHTML='<span style="color:#facc15">⚠️ Backend not configured</span>';}
}
init();
</script>
</body>
</html>
