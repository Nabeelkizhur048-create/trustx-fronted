  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <h3 style="color:white; font-size:12px; font-weight:800; margin:0;">🔴 Live Payouts</h3><span style="color:#00ff88; font-size:9px;">● 1,248 Online</span>
  </div>
  <div id="payout-list" style="display:flex; flex-direction:column; gap:8px;"></div>

<script>
const flags = { AED:"🇦🇪", INR:"🇮🇳", SAR:"🇸🇦", USD:"🇺🇸", EUR:"🇪🇺", GBP:"🇬🇧", PKR:"🇵🇰", BDT:"🇧🇩", QAR:"🇶🇦", KWD:"🇰🇼", OMR:"🇴🇲", BHD:"🇧🇭", PHP:"🇵🇭", TRY:"🇹🇷", ZAR:"🇿🇦", RUB:"🇷🇺", CNY:"🇨🇳", JPY:"🇯🇵" };
let allRates = [];
let showAll = false;

async function loadRealRates(){
  try{
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const data = await res.json();
    allRates = [];
    for(let code in flags){ if(data.rates[code]) allRates.push({code, flag:flags[code], val:data.rates[code]}) }
    renderRates();
    document.getElementById('live-time').innerText = '● LIVE ' + new Date().toLocaleTimeString();
  }catch(e){}
}
function renderRates(){
  const container = document.getElementById('rates-ticker');
  const list = showAll? allRates : allRates.slice(0,6);
  container.innerHTML = list.map(r=>`
    <div style="display:flex; justify-content:space-between; align-items:center; background:#0a0a0a; padding:10px 12px; border-radius:10px; border:1px solid #1a1a1a;">
      <div style="display:flex; align-items:center; gap:10px;"><div style="font-size:18px;">${r.flag}</div><div><div style="color:white; font-size:12px; font-weight:bold;">${r.code}</div><div style="color:#666; font-size:9px;">vs USD</div></div></div>
      <div style="text-align:right;"><div style="color:white; font-weight:800; font-size:13px;">${r.val.toFixed(2)}</div><div style="color:#00ff88; font-size:8px;">● live</div></div>
    </div>`).join('');
  document.getElementById('more-rates-btn').innerText = showAll? '↑ Show Less' : `↓ Show ${allRates.length-6} More Rates`;
}
function toggleRates(){ showAll=!showAll; renderRates(); }
loadRealRates(); setInterval(loadRealRates, 60000);

// PAYOUTS - USDT ONLY
const payouts = [
  {name:"Ali M.", amt:"1809 USDT", time:"Just now"},
  {name:"Salman M.", amt:"1555 USDT", time:"Just now"},
  {name:"Vikram M.", amt:"503 USDT", time:"Just now"},
];
function renderPayouts(){
  document.getElementById('payout-list').innerHTML = payouts.map(p=>`
    <div style="display:flex; justify-content:space-between; align-items:center; background:#0a0a0a; padding:10px 12px; border-radius:10px; border:1px solid #1a1a1a;">
      <div style="display:flex; align-items:center; gap:10px;"><div style="width:28px; height:28px; background:#1e293b; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; color:white; font-weight:bold;">${p.name[0]}</div><div><div style="color:white; font-size:11px; font-weight:bold;">${p.name}</div><div style="color:#888; font-size:10px;">${p.amt}</div></div></div>
      <div style="text-align:right;"><div style="color:#00ff88; font-size:10px; font-weight:bold;">✓ Paid</div><div style="color:#555; font-size:8px;">${p.time}</div></div>
    </div>`).join('');
}
renderPayouts();
setInterval(()=>{ payouts.unshift({name:["Vikram","Ali","Raj","Salman","Ahmad"][Math.floor(Math.random()*5)]+" M.", amt:Math.floor(Math.random()*3000+100)+" USDT", time:"Just now"}); payouts.pop(); renderPayouts(); }, 3500);
</script>
