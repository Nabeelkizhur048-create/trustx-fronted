<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { background:#000000; margin:0; font-family: -apple-system, sans-serif; display:flex; justify-content:center; }
  .phone { width:390px; background:#000000; min-height:100vh; padding:20px; box-sizing:border-box; }

</head>

      <div style="background:white; border-radius:8px; width:28px; height:28px; display:flex; align-items:center; justify-content:center;">🛡️</div>
      TrustX

      🔔 👤
    </div>
  </div>

  <!-- Hero -->
  <div style="padding:0 8px; margin-top:36px;">
    <h1 style="color:white; font-size:38px; font-weight:900; line-height:1.05; margin:0; letter-spacing:-0.5px;">
      Secure Trade<br/>
      TrustX TRC20<br/>
      Instantly
    </h1>

      Fast • Low fees • TRC20 deposits &<br/>

    <!-- Buttons - Photo പോലെ തന്നെ -->
    <button style="width:100%; background:#FCD535; color:black; border:none; padding:18px; border-radius:14px; font-weight:800; font-size:19px; margin-top:28px;">
      Open Wallet
    </button>

    <button style="width:100%; background:#1F1F1F; color:white; border:1px solid rgba(255,255,255,0.1); padding:18px; border-radius:14px; font-weight:600; font-size:19px; margin-top:14px;">
      How it Works
    </button>

    <!-- Badges -->
    <div style="display:flex; gap:6px; margin-top:20px;">
      <div style="background:#1E1E1E; border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:5px 10px; font-size:9px; color:#FCD535; font-weight:600;">🛡️ KYC Secured</div>
      <div style="background:#1E1E1E; border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:5px 10px; font-size:9px; color:white; font-weight:500;">🔒 2FA Protected</div>
      <div style="background:#1E1E1E; border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:5px 10px; font-size:9px; color:white; font-weight:500;">⚡ Instant Transfer</div>
    </div>

    <!-- Bottom TRC20 -->
    <div style="background:#111111; border-radius:14px; padding:14px; margin-top:32px; display:flex; gap:20px; font-size:10px; color:rgba(255,255,255,0.6); font-weight:600;">
      <div style="display:flex; align-items:center; gap:6px;"><span style="background:#26A17B; color:white; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-size:8px;">USDT</span> USDT • TRC20</div>
      <div style="display:flex; align-items:center; gap:6px;"><span style="background:#EF0027; color:white; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-size:8px;">TRX</span> TRX • TRC20</div>
    </div>

  </div>

</div>
</body>
</html>
